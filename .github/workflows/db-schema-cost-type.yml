name: DB Schema - Add CostType table and ProjectExpense.costTypeId (one-off)

# Manual-only: menambah tabel CostType (master jenis biaya proyek) dan kolom
# ProjectExpense.costTypeId yang menunjuk ke sana.
#
# Kenapa dibutuhkan: CostingLineItem tidak punya ExpenseCategory sama sekali,
# jadi pagu PER JENIS BIAYA tidak bisa dibandingkan dengan realisasinya —
# papan biaya menulis "belum dipetakan". CostType adalah lapisan
# penghubungnya, dan ia bermuara ke ExpenseCategory lewat kolom `category`
# sehingga seluruh laporan lama tetap benar tanpa disentuh.
#
# DUA HAL YANG MEMBUAT WORKFLOW INI AMAN DIJALANKAN ULANG:
#
#   1. --single-transaction. Kalau ada satu perintah yang gagal, SEMUANYA
#      dibatalkan. Tanpa ini psql berjalan autocommit: perintah yang terlanjur
#      sukses tetap tersimpan, dan basis data tertinggal setengah jadi —
#      keadaan yang paling sulit dibereskan karena menjalankan ulang lalu
#      gagal dengan "already exists".
#   2. Seluruh perintah idempoten (IF NOT EXISTS, foreign key dijaga manual
#      karena Postgres belum punya ADD CONSTRAINT IF NOT EXISTS). Jadi
#      menjalankan ulang setelah gagal — atau karena ragu — tidak merusak
#      apa pun.
#
# AMAN DAN ADITIF: satu tabel baru, satu kolom nullable tanpa default (instan
# di Postgres, tidak ada penulisan ulang tabel), kedua foreign key ON DELETE
# SET NULL. Tidak ada DROP, TRUNCATE, atau DELETE.
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          if [ -z "$NEW_DATABASE_URL" ]; then
            echo "NEW_DATABASE_URL kosong. Periksa secret repositori sebelum menjalankan ulang."
            exit 1
          fi
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          -- Idempoten: aman dijalankan ulang kalau sebelumnya gagal di tengah.
          ALTER TABLE "ProjectExpense" ADD COLUMN IF NOT EXISTS "costTypeId" TEXT;

          CREATE TABLE IF NOT EXISTS "CostType" (
              "id" TEXT NOT NULL,
              "code" TEXT NOT NULL,
              "name" TEXT NOT NULL,
              "description" TEXT,
              "category" "ExpenseCategory" NOT NULL,
              "chartOfAccountId" TEXT,
              "isActive" BOOLEAN NOT NULL DEFAULT true,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "CostType_pkey" PRIMARY KEY ("id")
          );

          CREATE UNIQUE INDEX IF NOT EXISTS "CostType_code_key" ON "CostType"("code");
          CREATE INDEX IF NOT EXISTS "CostType_category_idx" ON "CostType"("category");
          CREATE INDEX IF NOT EXISTS "CostType_isActive_idx" ON "CostType"("isActive");
          CREATE INDEX IF NOT EXISTS "CostType_chartOfAccountId_idx" ON "CostType"("chartOfAccountId");
          CREATE INDEX IF NOT EXISTS "ProjectExpense_costTypeId_idx" ON "ProjectExpense"("costTypeId");

          -- Postgres belum punya ADD CONSTRAINT IF NOT EXISTS, jadi dijaga manual.
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'ProjectExpense_costTypeId_fkey') THEN
              ALTER TABLE "ProjectExpense" ADD CONSTRAINT "ProjectExpense_costTypeId_fkey"
                FOREIGN KEY ("costTypeId") REFERENCES "CostType"("id") ON DELETE SET NULL ON UPDATE CASCADE;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'CostType_chartOfAccountId_fkey') THEN
              ALTER TABLE "CostType" ADD CONSTRAINT "CostType_chartOfAccountId_fkey"
                FOREIGN KEY ("chartOfAccountId") REFERENCES "ChartOfAccount"("id") ON DELETE SET NULL ON UPDATE CASCADE;
            END IF;
          END $$;
          SQL

      - name: Verify table and column exist
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          echo "-- kolom CostType --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'CostType' ORDER BY ordinal_position;"
          echo "-- ProjectExpense.costTypeId --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'ProjectExpense' AND column_name = 'costTypeId';"
          echo "-- biaya lama tetap utuh --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT count(*) AS biaya_proyek, count(\"costTypeId\") AS sudah_berjenis FROM \"ProjectExpense\" WHERE \"deletedAt\" IS NULL;"
