name: DB Schema - Add CostType table and ProjectExpense.costTypeId (one-off)

# Manual-only, one-off schema change: menambah tabel CostType (master jenis
# biaya proyek) dan kolom ProjectExpense.costTypeId yang menunjuk ke sana.
#
# Kenapa ini dibutuhkan: CostingLineItem tidak punya ExpenseCategory sama
# sekali, jadi pagu PER JENIS BIAYA tidak bisa dibandingkan dengan
# realisasinya — papan biaya sampai sekarang menulis "belum dipetakan".
# CostType adalah lapisan penghubungnya, dan ia bermuara ke ExpenseCategory
# lewat kolom `category` sehingga seluruh laporan lama tetap benar tanpa
# disentuh.
#
# SQL di bawah dihasilkan `prisma migrate diff` yang membandingkan schema
# sebelum dan sesudah perubahan (tanpa perlu koneksi basis data).
#
# AMAN DAN ADITIF:
#   - satu tabel baru, tidak menyentuh data yang ada
#   - ProjectExpense.costTypeId nullable tanpa default, jadi instan di
#     Postgres (tidak ada penulisan ulang tabel) dan ribuan biaya lama tetap
#     valid apa adanya
#   - kedua foreign key memakai ON DELETE SET NULL: menghapus akun atau jenis
#     biaya tidak boleh ikut menghapus biaya proyek
#   - tidak ada DROP, tidak ada kehilangan data
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- AlterTable
          ALTER TABLE "ProjectExpense" ADD COLUMN     "costTypeId" TEXT;

          -- CreateTable
          CREATE TABLE "CostType" (
              "id" TEXT NOT NULL,
              "code" TEXT NOT NULL,
              "name" TEXT NOT NULL,
              "description" TEXT,
              "category" "ExpenseCategory" NOT NULL,
              "chartOfAccountId" TEXT,
              "isActive" BOOLEAN NOT NULL DEFAULT true,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "CostType_pkey" PRIMARY KEY ("id")
          );

          -- CreateIndex
          CREATE UNIQUE INDEX "CostType_code_key" ON "CostType"("code");

          -- CreateIndex
          CREATE INDEX "CostType_category_idx" ON "CostType"("category");

          -- CreateIndex
          CREATE INDEX "CostType_isActive_idx" ON "CostType"("isActive");

          -- CreateIndex
          CREATE INDEX "CostType_chartOfAccountId_idx" ON "CostType"("chartOfAccountId");

          -- CreateIndex
          CREATE INDEX "ProjectExpense_costTypeId_idx" ON "ProjectExpense"("costTypeId");

          -- AddForeignKey
          ALTER TABLE "ProjectExpense" ADD CONSTRAINT "ProjectExpense_costTypeId_fkey" FOREIGN KEY ("costTypeId") REFERENCES "CostType"("id") ON DELETE SET NULL ON UPDATE CASCADE;

          -- AddForeignKey
          ALTER TABLE "CostType" ADD CONSTRAINT "CostType_chartOfAccountId_fkey" FOREIGN KEY ("chartOfAccountId") REFERENCES "ChartOfAccount"("id") ON DELETE SET NULL ON UPDATE CASCADE;
          SQL

      - name: Verify table and column exist
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          echo "-- CostType columns --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'CostType' ORDER BY ordinal_position;"
          echo "-- ProjectExpense.costTypeId --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'ProjectExpense' AND column_name = 'costTypeId';"
          echo "-- biaya lama tetap utuh --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT count(*) AS biaya_proyek, count(\"costTypeId\") AS sudah_berjenis FROM \"ProjectExpense\" WHERE \"deletedAt\" IS NULL;"
