name: DB Schema - Add revision history tables (one-off)

# Manual-only, one-off schema change: adds two new tables,
# QuotationRevisionHistory and CostingSheetRevisionHistory, that store a
# read-only JSON snapshot of a Quotation/Costing Sheet's content each time it
# gets superseded by a new revision (see reviseQuotation/reviseCostingSheet
# in src/lib/workflows/). Purely additive — two new tables, no drops, no
# column changes on any existing table, no data loss. The exact SQL below
# was generated by `prisma migrate diff` comparing the schema before/after
# this change (no DB connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE "QuotationRevisionHistory" (
              "id" TEXT NOT NULL,
              "quotationId" TEXT NOT NULL,
              "revision" INTEGER NOT NULL,
              "snapshot" JSONB NOT NULL,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,

              CONSTRAINT "QuotationRevisionHistory_pkey" PRIMARY KEY ("id")
          );

          CREATE TABLE "CostingSheetRevisionHistory" (
              "id" TEXT NOT NULL,
              "costingSheetId" TEXT NOT NULL,
              "revision" INTEGER NOT NULL,
              "snapshot" JSONB NOT NULL,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,

              CONSTRAINT "CostingSheetRevisionHistory_pkey" PRIMARY KEY ("id")
          );

          CREATE INDEX "QuotationRevisionHistory_quotationId_idx" ON "QuotationRevisionHistory"("quotationId");

          CREATE UNIQUE INDEX "QuotationRevisionHistory_quotationId_revision_key" ON "QuotationRevisionHistory"("quotationId", "revision");

          CREATE INDEX "CostingSheetRevisionHistory_costingSheetId_idx" ON "CostingSheetRevisionHistory"("costingSheetId");

          CREATE UNIQUE INDEX "CostingSheetRevisionHistory_costingSheetId_revision_key" ON "CostingSheetRevisionHistory"("costingSheetId", "revision");

          ALTER TABLE "QuotationRevisionHistory" ADD CONSTRAINT "QuotationRevisionHistory_quotationId_fkey" FOREIGN KEY ("quotationId") REFERENCES "Quotation"("id") ON DELETE CASCADE ON UPDATE CASCADE;

          ALTER TABLE "CostingSheetRevisionHistory" ADD CONSTRAINT "CostingSheetRevisionHistory_costingSheetId_fkey" FOREIGN KEY ("costingSheetId") REFERENCES "CostingSheet"("id") ON DELETE CASCADE ON UPDATE CASCADE;
          SQL

      - name: Verify tables exist
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name = 'QuotationRevisionHistory';"
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name = 'CostingSheetRevisionHistory';"
