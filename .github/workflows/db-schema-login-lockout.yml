name: DB Schema - Add User login-lockout columns (one-off)

# Manual-only, one-off schema change: adds User.failedLoginAttempts (default
# 0) and User.lockedUntil (nullable) — backs the new login brute-force
# protection (see src/app/(auth)/login/actions.ts). Purely additive — two
# new columns, no drops, no data loss. The exact SQL below was generated by
# `prisma migrate diff` comparing the schema before/after this change (no DB
# connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE "User" ADD COLUMN     "failedLoginAttempts" INTEGER NOT NULL DEFAULT 0,
          ADD COLUMN     "lockedUntil" TIMESTAMP(3);
          SQL

      - name: Verify columns exist
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'User' AND column_name IN ('failedLoginAttempts','lockedUntil') ORDER BY column_name;"
