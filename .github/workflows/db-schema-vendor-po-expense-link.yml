name: DB Schema - Link VendorPurchaseOrder to ProjectExpense (one-off)

# Manual-only, one-off schema change: adds ProjectExpense.vendorPurchaseOrderId
# (nullable, unique FK to VendorPurchaseOrder) so a Vendor PO's cost can be
# tracked through the existing evidence-gated Expense Approve -> Mark as Paid
# flow instead of a separate parallel payment system. The exact SQL below was
# generated by `prisma migrate diff` comparing the schema before/after this
# change (no DB connection needed to generate it) — see the PR that added
# this workflow for the schema.prisma diff it corresponds to. Purely
# additive: a new nullable column + unique index + FK constraint, no drop, no
# data loss, and instant on Postgres (no default value, no table rewrite).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE "ProjectExpense" ADD COLUMN     "vendorPurchaseOrderId" TEXT;
          CREATE UNIQUE INDEX "ProjectExpense_vendorPurchaseOrderId_key" ON "ProjectExpense"("vendorPurchaseOrderId");
          ALTER TABLE "ProjectExpense" ADD CONSTRAINT "ProjectExpense_vendorPurchaseOrderId_fkey" FOREIGN KEY ("vendorPurchaseOrderId") REFERENCES "VendorPurchaseOrder"("id") ON DELETE SET NULL ON UPDATE CASCADE;
          SQL

      - name: Verify column exists
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'ProjectExpense' AND column_name = 'vendorPurchaseOrderId';"
