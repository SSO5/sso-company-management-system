name: DB Schema - Add TelegramPendingInvoice table (one-off)

# Manual-only, one-off schema change for the "buat invoice via Telegram"
# feature: adds the TelegramPendingInvoice table, which holds one simulated
# invoice request awaiting the user's "ya"/"batal" reply — see
# lib/workflows/telegram-invoice.ts and app/api/telegram/webhook/route.ts.
# Purely additive — one new table, no drops, no data loss. Exact SQL below
# was generated by `prisma migrate diff` comparing the schema before/after
# this change (no DB connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE "TelegramPendingInvoice" (
              "id" TEXT NOT NULL,
              "chatId" TEXT NOT NULL,
              "projectId" TEXT NOT NULL,
              "customerId" TEXT NOT NULL,
              "quotationId" TEXT,
              "amount" DECIMAL(18,2) NOT NULL,
              "dpPercent" DECIMAL(5,2),
              "dueDate" TIMESTAMP(3) NOT NULL,
              "previewText" TEXT NOT NULL,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "expiresAt" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "TelegramPendingInvoice_pkey" PRIMARY KEY ("id")
          );

          CREATE INDEX "TelegramPendingInvoice_chatId_idx" ON "TelegramPendingInvoice"("chatId");
          SQL

      - name: Verify
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name = 'TelegramPendingInvoice';"
