name: DB Schema - Add TelegramCostingDraft table (one-off)

# Manual-only, one-off schema change for the "buat costing baru via
# Telegram" feature: adds the TelegramCostingDraft table, which accumulates
# a new Costing Sheet's fields (customer, project title, items) across
# several chat messages before it's saved — see
# lib/workflows/telegram-costing-draft.ts and app/api/telegram/webhook/route.ts.
# Purely additive — one new table, no drops, no data loss. Exact SQL below
# was generated by `prisma migrate diff` comparing the schema before/after
# this change (no DB connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE "TelegramCostingDraft" (
              "id" TEXT NOT NULL,
              "chatId" TEXT NOT NULL,
              "customerId" TEXT,
              "customerName" TEXT,
              "projectTitle" TEXT,
              "jobNo" TEXT,
              "operationalCost" DECIMAL(18,2) NOT NULL DEFAULT 0,
              "itemsJson" JSONB NOT NULL DEFAULT '[]',
              "stage" TEXT NOT NULL DEFAULT 'COLLECTING',
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" TIMESTAMP(3) NOT NULL,
              "expiresAt" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "TelegramCostingDraft_pkey" PRIMARY KEY ("id")
          );

          CREATE INDEX "TelegramCostingDraft_chatId_idx" ON "TelegramCostingDraft"("chatId");
          SQL

      - name: Verify
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name = 'TelegramCostingDraft';"
