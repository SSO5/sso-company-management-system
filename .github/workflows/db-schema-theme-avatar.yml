name: DB Schema - Add avatarUrl and theme settings (one-off)

# Manual-only, one-off schema change: adds User.avatarUrl (profile photo),
# CompanySettings.themePreset (named color palette, see
# lib/theme-presets.ts), and CompanySettings.dashboardBackgroundUrl (hero
# background photo behind the dashboard header). The exact SQL below was
# generated by `prisma migrate diff` comparing the schema before/after this
# change (no DB connection needed to generate it) — see the PR that added
# this workflow for the schema.prisma diff it corresponds to. Purely
# additive: three new nullable/defaulted columns, no drop, no data loss,
# instant on Postgres.
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE "User" ADD COLUMN     "avatarUrl" TEXT;
          ALTER TABLE "CompanySettings" ADD COLUMN     "dashboardBackgroundUrl" TEXT,
          ADD COLUMN     "themePreset" TEXT NOT NULL DEFAULT 'navy';
          SQL

      - name: Verify columns exist
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'User' AND column_name = 'avatarUrl';"
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'CompanySettings' AND column_name = 'themePreset';"
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'CompanySettings' AND column_name = 'dashboardBackgroundUrl';"
