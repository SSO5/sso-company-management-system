name: DB Schema - Add AssistantPendingAction table (one-off)

# Manual-only, one-off schema change for the in-app AI assistant (chat
# widget on every page): adds the AssistantPendingAction table, which holds
# one write action the assistant proposed (approve/reject a quotation) that
# is awaiting the user's Confirm/Cancel click in the chat UI — see
# src/server/assistant.ts and src/lib/ai/assistant-tools.ts. Purely
# additive — one new table, no drops, no data loss. Exact SQL below was
# generated by `prisma migrate diff` comparing the schema before/after this
# change (no DB connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE "AssistantPendingAction" (
              "id" TEXT NOT NULL,
              "userId" TEXT NOT NULL,
              "toolName" TEXT NOT NULL,
              "argsJson" JSONB NOT NULL,
              "description" TEXT NOT NULL,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "expiresAt" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "AssistantPendingAction_pkey" PRIMARY KEY ("id")
          );

          CREATE INDEX "AssistantPendingAction_userId_idx" ON "AssistantPendingAction"("userId");
          SQL

      - name: Verify
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name = 'AssistantPendingAction';"
