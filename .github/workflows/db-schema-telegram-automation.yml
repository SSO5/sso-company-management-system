name: DB Schema - Add Telegram automation fields (one-off)

# Manual-only, one-off schema change for the quotation-revision-via-Telegram
# feature: adds User.telegramChatId (maps an inbound Telegram chat to a real
# User) and a new TelegramPendingRevision table (holds a simulated revision
# awaiting the user's "ya"/"batal" reply — see
# app/api/telegram/webhook/route.ts). Purely additive — one new nullable
# column, one new table, no drops, no data loss. Exact SQL below was
# generated by `prisma migrate diff` comparing the schema before/after this
# change (no DB connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE "User" ADD COLUMN     "telegramChatId" TEXT;

          CREATE TABLE "TelegramPendingRevision" (
              "id" TEXT NOT NULL,
              "chatId" TEXT NOT NULL,
              "quotationId" TEXT NOT NULL,
              "costingId" TEXT NOT NULL,
              "actionJson" JSONB NOT NULL,
              "previewText" TEXT NOT NULL,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "expiresAt" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "TelegramPendingRevision_pkey" PRIMARY KEY ("id")
          );

          CREATE INDEX "TelegramPendingRevision_chatId_idx" ON "TelegramPendingRevision"("chatId");

          CREATE UNIQUE INDEX "User_telegramChatId_key" ON "User"("telegramChatId");
          SQL

      - name: Verify
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'User' AND column_name = 'telegramChatId';"
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name = 'TelegramPendingRevision';"
