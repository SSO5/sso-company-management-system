name: DB Schema - Add Directive.notifiedAt column (one-off)

# Manual-only, one-off schema change: adds the nullable notifiedAt column to
# Directive, used to queue "Tugas dari Direktur" WA/email notifications
# instead of sending them all in the same instant (see
# dispatchPendingDirectiveNotifications() in src/lib/workflows/cron-jobs.ts).
# Purely additive — one new nullable column + one index, no drops, no data
# loss. The exact SQL below was generated by `prisma migrate diff` comparing
# the schema before/after this change (no DB connection needed to generate
# it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE "Directive" ADD COLUMN     "notifiedAt" TIMESTAMP(3);

          CREATE INDEX "Directive_notifiedAt_idx" ON "Directive"("notifiedAt");
          SQL

      - name: Verify column exists
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'Directive' AND column_name = 'notifiedAt';"
