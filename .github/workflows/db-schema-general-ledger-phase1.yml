name: DB Schema - General Ledger Phase 1 (ChartOfAccount + CompanyExpense) (one-off)

# Manual-only, one-off schema change: adds ChartOfAccount + CompanyExpense
# (see prisma/schema.prisma's "GENERAL LEDGER" section for why), plus the
# COMPANY_EXPENSE numbering entity type and companyExpensePrefix setting.
# Purely additive — two new tables, one new enum, one new enum value, one
# new column with a default. No drops, no data loss. SQL generated by
# `prisma migrate diff` comparing the schema before/after this change (no DB
# connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- CreateEnum
          CREATE TYPE "AccountType" AS ENUM ('ASSET', 'LIABILITY', 'EQUITY', 'REVENUE', 'EXPENSE');

          -- AlterEnum
          ALTER TYPE "NumberEntityType" ADD VALUE 'COMPANY_EXPENSE';
          SQL

      - name: Apply table changes (separate step - new enum value needs its own committed transaction first)
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- AlterTable
          ALTER TABLE "CompanySettings" ADD COLUMN     "companyExpensePrefix" TEXT NOT NULL DEFAULT 'OPX/FIN';

          -- CreateTable
          CREATE TABLE "ChartOfAccount" (
              "id" TEXT NOT NULL,
              "code" TEXT NOT NULL,
              "name" TEXT NOT NULL,
              "type" "AccountType" NOT NULL,
              "description" TEXT,
              "isActive" BOOLEAN NOT NULL DEFAULT true,
              "openingBalance" DECIMAL(18,2) NOT NULL DEFAULT 0,
              "openingBalanceDate" TIMESTAMP(3),
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "ChartOfAccount_pkey" PRIMARY KEY ("id")
          );

          -- CreateTable
          CREATE TABLE "CompanyExpense" (
              "id" TEXT NOT NULL,
              "number" TEXT NOT NULL,
              "accountId" TEXT,
              "description" TEXT NOT NULL,
              "vendor" TEXT,
              "date" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "amount" DECIMAL(18,2) NOT NULL,
              "tax" DECIMAL(18,2) NOT NULL DEFAULT 0,
              "total" DECIMAL(18,2) NOT NULL,
              "paymentStatus" "ExpensePaymentStatus" NOT NULL DEFAULT 'UNPAID',
              "approvalStatus" "ExpenseApprovalStatus" NOT NULL DEFAULT 'DRAFT',
              "submittedAt" TIMESTAMP(3),
              "submittedById" TEXT,
              "approvedAt" TIMESTAMP(3),
              "approvedById" TEXT,
              "rejectedAt" TIMESTAMP(3),
              "rejectedById" TEXT,
              "rejectionReason" TEXT,
              "createdById" TEXT NOT NULL,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" TIMESTAMP(3) NOT NULL,
              "deletedAt" TIMESTAMP(3),

              CONSTRAINT "CompanyExpense_pkey" PRIMARY KEY ("id")
          );

          -- CreateIndex
          CREATE UNIQUE INDEX "ChartOfAccount_code_key" ON "ChartOfAccount"("code");

          -- CreateIndex
          CREATE INDEX "ChartOfAccount_type_idx" ON "ChartOfAccount"("type");

          -- CreateIndex
          CREATE UNIQUE INDEX "CompanyExpense_number_key" ON "CompanyExpense"("number");

          -- CreateIndex
          CREATE INDEX "CompanyExpense_approvalStatus_idx" ON "CompanyExpense"("approvalStatus");

          -- CreateIndex
          CREATE INDEX "CompanyExpense_accountId_idx" ON "CompanyExpense"("accountId");

          -- AddForeignKey
          ALTER TABLE "CompanyExpense" ADD CONSTRAINT "CompanyExpense_accountId_fkey" FOREIGN KEY ("accountId") REFERENCES "ChartOfAccount"("id") ON DELETE SET NULL ON UPDATE CASCADE;

          -- AddForeignKey
          ALTER TABLE "CompanyExpense" ADD CONSTRAINT "CompanyExpense_submittedById_fkey" FOREIGN KEY ("submittedById") REFERENCES "User"("id") ON DELETE SET NULL ON UPDATE CASCADE;

          -- AddForeignKey
          ALTER TABLE "CompanyExpense" ADD CONSTRAINT "CompanyExpense_approvedById_fkey" FOREIGN KEY ("approvedById") REFERENCES "User"("id") ON DELETE SET NULL ON UPDATE CASCADE;

          -- AddForeignKey
          ALTER TABLE "CompanyExpense" ADD CONSTRAINT "CompanyExpense_rejectedById_fkey" FOREIGN KEY ("rejectedById") REFERENCES "User"("id") ON DELETE SET NULL ON UPDATE CASCADE;

          -- AddForeignKey
          ALTER TABLE "CompanyExpense" ADD CONSTRAINT "CompanyExpense_createdById_fkey" FOREIGN KEY ("createdById") REFERENCES "User"("id") ON DELETE RESTRICT ON UPDATE CASCADE;
          SQL

      - name: Verify tables exist
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name IN ('ChartOfAccount', 'CompanyExpense');"
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'CompanySettings' AND column_name = 'companyExpensePrefix';"
          psql "$NEW_DATABASE_URL" -tAc "SELECT enumlabel FROM pg_enum WHERE enumtypid = (SELECT oid FROM pg_type WHERE typname = 'NumberEntityType') AND enumlabel = 'COMPANY_EXPENSE';"
