name: DB Repair - Unlink Costing Sheet from deleted Quotation 003/QUO/MKT/VIII/2026 (one-off)

# One-off data repair, not a schema change. Before the fix in
# lib/workflows/quotation.ts:deleteQuotation, deleting a Quotation never
# cleared quotationId on the Costing Sheet that had been converted into it —
# so an already-deleted "003/QUO/MKT/VIII/2026" left its source Costing Sheet
# (originally "004/CST/MKT/VIII/2026", now at R3) CONVERTED and still
# pointing at the deleted row. Its "View Quotation" button 404s
# (getQuotation filters deletedAt: null), which Next.js surfaces as an opaque
# server-side exception.
#
# This workflow only touches CostingSheet rows whose quotationId points at a
# Quotation matching that exact unique number AND already has deletedAt set
# — it can never affect a live, non-deleted quotation. Run with apply=false
# first (default) to see exactly which row(s) would change; only dispatch
# with apply=true once that output looks right.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually apply the fix (false = dry run, only SELECTs)"
        type: boolean
        default: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Show the affected row(s) before any change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Diagnostic: show the exact linked quotation's real state,
          -- regardless of number/deletedAt, so we can see why the intended
          -- targeted match found nothing.
          SELECT cs.id AS costing_id, cs.number AS costing_number, cs.revision AS costing_revision,
                 cs.status AS costing_status, cs."quotationId",
                 q.id AS quotation_id, q.number AS quotation_number, q.status AS quotation_status,
                 q."deletedAt" AS quotation_deleted_at
          FROM "CostingSheet" cs
          LEFT JOIN "Quotation" q ON q.id = cs."quotationId"
          WHERE cs.number = '004/CST/MKT/VIII/2026';
          SQL

      - name: Apply repair (unlink + reopen the Costing Sheet)
        if: ${{ inputs.apply }}
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Confirmed via the diagnostic step above: CostingSheet
          -- cmt08eq8a00077azr78mjybm8 (004/CST/MKT/VIII/2026) points at
          -- Quotation cmt08iqme000w7azr14ywbw8b, whose stored `number` turns
          -- out to already include the ".R3" suffix
          -- (003/QUO/MKT/VIII/2026.R3) and whose deletedAt is genuinely set
          -- (2026-08-20 13:19:57.658). Matching by exact primary keys, not a
          -- guessed number string, so this can only ever touch that one row.
          -- The AND EXISTS re-checks deletedAt IS NOT NULL live at apply
          -- time too, as a defense-in-depth guard against a stale plan.
          UPDATE "CostingSheet"
          SET "quotationId" = NULL, "status" = 'DRAFT'
          WHERE id = 'cmt08eq8a00077azr78mjybm8'
            AND "quotationId" = 'cmt08iqme000w7azr14ywbw8b'
            AND EXISTS (
              SELECT 1 FROM "Quotation"
              WHERE id = 'cmt08iqme000w7azr14ywbw8b' AND "deletedAt" IS NOT NULL
            );
          SQL

      - name: Show the row(s) after (confirms whether the repair ran)
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, number, revision, status, "quotationId"
          FROM "CostingSheet"
          WHERE number = '004/CST/MKT/VIII/2026';
          SQL
