name: DB Diagnose - Real usage audit (read-only, one-off)

# Read-only diagnostic to ground the "what's unused / what's underutilized"
# codebase review in real production data instead of guesses: record counts
# per module, role distribution, and feature-adoption signals (WA number /
# Telegram chat ID / avatar set). No UPDATE/INSERT/DELETE — SELECT only.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Record counts per module
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'User' t, count(*) FROM "User"
          UNION ALL SELECT 'Customer', count(*) FROM "Customer"
          UNION ALL SELECT 'Opportunity', count(*) FROM "Opportunity"
          UNION ALL SELECT 'Quotation', count(*) FROM "Quotation"
          UNION ALL SELECT 'QuotationRevisionHistory', count(*) FROM "QuotationRevisionHistory"
          UNION ALL SELECT 'CostingSheet', count(*) FROM "CostingSheet"
          UNION ALL SELECT 'CostingSheetRevisionHistory', count(*) FROM "CostingSheetRevisionHistory"
          UNION ALL SELECT 'PurchaseOrder', count(*) FROM "PurchaseOrder"
          UNION ALL SELECT 'Contract', count(*) FROM "Contract"
          UNION ALL SELECT 'VendorPurchaseOrder', count(*) FROM "VendorPurchaseOrder"
          UNION ALL SELECT 'Project', count(*) FROM "Project"
          UNION ALL SELECT 'ProjectTask', count(*) FROM "ProjectTask"
          UNION ALL SELECT 'ProjectMilestone', count(*) FROM "ProjectMilestone"
          UNION ALL SELECT 'ProjectExpense', count(*) FROM "ProjectExpense"
          UNION ALL SELECT 'ProgressReport', count(*) FROM "ProgressReport"
          UNION ALL SELECT 'Invoice', count(*) FROM "Invoice"
          UNION ALL SELECT 'Payment', count(*) FROM "Payment"
          UNION ALL SELECT 'Document', count(*) FROM "Document"
          UNION ALL SELECT 'Notification', count(*) FROM "Notification"
          UNION ALL SELECT 'ActivityLog', count(*) FROM "ActivityLog"
          UNION ALL SELECT 'Directive', count(*) FROM "Directive"
          UNION ALL SELECT 'TelegramPendingRevision', count(*) FROM "TelegramPendingRevision"
          UNION ALL SELECT 'TelegramCostingDraft', count(*) FROM "TelegramCostingDraft"
          UNION ALL SELECT 'TelegramPendingInvoice', count(*) FROM "TelegramPendingInvoice"
          UNION ALL SELECT 'AssistantPendingAction', count(*) FROM "AssistantPendingAction"
          ORDER BY 1;
          SQL

      - name: Role distribution (real users only)
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT role, "isActive", count(*) FROM "User" GROUP BY role, "isActive" ORDER BY role;
          SQL

      - name: Feature-adoption signals per user
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            name, role, "isActive",
            ("whatsappNumber" IS NOT NULL) AS has_wa,
            ("telegramChatId" IS NOT NULL) AS has_telegram,
            ("avatarUrl" IS NOT NULL) AS has_avatar,
            "lastLoginAt"
          FROM "User"
          ORDER BY role, name;
          SQL

      - name: Notification delivery signal (last 30 days)
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT type, count(*), count(*) FILTER (WHERE "isRead") AS read_count
          FROM "Notification"
          WHERE "createdAt" > now() - interval '30 days'
          GROUP BY type
          ORDER BY count(*) DESC;
          SQL

      - name: AssistantPendingAction usage (AISSO adoption signal)
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*) AS total_ever, count(*) FILTER (WHERE "createdAt" > now() - interval '30 days') AS last_30_days
          FROM "AssistantPendingAction";
          SQL
