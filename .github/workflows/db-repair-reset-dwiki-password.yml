name: DB Repair - Reset Dwiki's password and unlock (one-off)

# Dwiki's account got re-locked after a fresh round of wrong-password
# attempts. Founder asked for a brand-new password instead of continuing to
# guess the old one. Sets User.passwordHash to a bcrypt hash (12 salt
# rounds, same as src/lib/auth/password.ts) of a new password generated and
# verified locally before this workflow was written, and clears any
# lockout state so it's usable immediately. Scoped to this exact user id.
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Set new password hash and clear lockout
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          UPDATE "User"
          SET "passwordHash" = '$2a$12$eQz2o33dMq9lllqhGKRd/.4vY/AV3ba09yOrzl5cQjauP58RWspwe',
              "lockedUntil" = NULL,
              "failedLoginAttempts" = 0
          WHERE id = 'cmskx9h64002bzxgrffrpyyrn';
          SQL

      - name: Verify
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, name, email, "failedLoginAttempts", "lockedUntil",
                 left("passwordHash", 12) AS hash_prefix
          FROM "User"
          WHERE id = 'cmskx9h64002bzxgrffrpyyrn';
          SQL
