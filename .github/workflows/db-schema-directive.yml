name: DB Schema - Add Directive table (one-off)

# Manual-only, one-off schema change: adds the DirectiveStatus enum and the
# Directive table backing "Tugas dari Direktur" (ADMIN gives a task/reminder
# to one user, a role, or all active users through the system instead of
# personal WhatsApp — see src/server/directives.ts). Purely additive — one
# new enum, one new table, no drops, no column changes on any existing
# table, no data loss. The exact SQL below was generated by
# `prisma migrate diff` comparing the schema before/after this change (no DB
# connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TYPE "DirectiveStatus" AS ENUM ('OPEN', 'DONE');

          CREATE TABLE "Directive" (
              "id" TEXT NOT NULL,
              "batchId" TEXT NOT NULL,
              "title" TEXT NOT NULL,
              "description" TEXT,
              "dueDate" TIMESTAMP(3),
              "assignedToId" TEXT NOT NULL,
              "assignedById" TEXT NOT NULL,
              "status" "DirectiveStatus" NOT NULL DEFAULT 'OPEN',
              "completedAt" TIMESTAMP(3),
              "response" TEXT,
              "respondedAt" TIMESTAMP(3),
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" TIMESTAMP(3) NOT NULL,

              CONSTRAINT "Directive_pkey" PRIMARY KEY ("id")
          );

          CREATE INDEX "Directive_assignedToId_status_idx" ON "Directive"("assignedToId", "status");

          CREATE INDEX "Directive_batchId_idx" ON "Directive"("batchId");

          CREATE INDEX "Directive_assignedById_idx" ON "Directive"("assignedById");

          ALTER TABLE "Directive" ADD CONSTRAINT "Directive_assignedToId_fkey" FOREIGN KEY ("assignedToId") REFERENCES "User"("id") ON DELETE RESTRICT ON UPDATE CASCADE;

          ALTER TABLE "Directive" ADD CONSTRAINT "Directive_assignedById_fkey" FOREIGN KEY ("assignedById") REFERENCES "User"("id") ON DELETE RESTRICT ON UPDATE CASCADE;
          SQL

      - name: Verify table exists
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name = 'Directive';"
