name: Backup - Daily database dump

# Scheduled pg_dump of production, kept as a GitHub Actions artifact for 30
# days. Read-only against the database (never writes), reuses the existing
# NEW_DATABASE_URL secret already used by the db-schema-*/db-repair-*
# workflows in this repo — no new secrets required. This is the only backup
# automation in the project; before this, recovery relied entirely on
# whatever point-in-time-recovery window the Postgres host's plan happens
# to include.
on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 01:00 WIB — off-hours
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Dump database
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          FILENAME="sso-backup-$(date +%Y-%m-%d).dump"
          pg_dump "$NEW_DATABASE_URL" -Fc -f "$FILENAME"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 30
