name: DB Schema - Add User.uiMood column (one-off)

# Manual-only, one-off schema change: adds User.uiMood (default "default"),
# backing the new personal "suasana" (mood) picker — see lib/ui-moods.ts and
# components/layout/mood-switcher.tsx. Purely additive — one new column, no
# drops, no data loss. SQL generated by `prisma migrate diff` comparing the
# schema before/after this change (no DB connection needed to generate it).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE "User" ADD COLUMN     "uiMood" TEXT NOT NULL DEFAULT 'default';
          SQL

      - name: Verify column exists
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_DATABASE_URL" -tAc "SELECT column_name, column_default FROM information_schema.columns WHERE table_name = 'User' AND column_name = 'uiMood';"
