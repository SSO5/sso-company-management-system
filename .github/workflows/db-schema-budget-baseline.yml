name: DB Schema - Add ProjectBudgetBaseline and its lines (one-off)

# Manual-only, one-off schema change: menambah dua tabel baru untuk budget
# baseline proyek beserta riwayat versinya.
#
# Kenapa tabel sendiri, bukan satu kolom di Project: Project.budget bisa
# diubah kapan saja lewat form proyek, dan angka yang ikut bergerak tidak
# bisa dipakai sebagai pembanding. Baseline adalah salinan BEKU dari satu
# versi costing final — itulah yang membuat kalimat "lewat pagu 12%" punya
# arti, karena pagunya tidak bisa diam-diam disesuaikan agar cocok.
#
# Nomor dan revisi costing disalin ke dalam baris baseline, bukan sekadar
# ditautkan, sehingga costing yang kelak dihapus tidak membatalkan baseline.
#
# SQL di bawah dihasilkan `prisma migrate diff`, DITAMBAH satu indeks unik
# parsial yang tidak bisa dinyatakan di schema.prisma:
#
#   ProjectBudgetBaseline_one_current_per_project
#
# Indeks itu menegakkan aturan "hanya satu versi yang berlaku per proyek" di
# basis data, bukan hanya lewat disiplin kode. Tanpa itu, satu galat di
# server bisa meninggalkan dua baseline berlaku sekaligus, dan papan biaya
# akan memilih salah satunya tanpa ada yang tahu.
#
# AMAN DAN ADITIF: dua tabel baru, tidak menyentuh data yang ada, tidak ada
# DROP maupun perubahan kolom pada tabel lama.
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply schema change
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          psql "$NEW_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- CreateTable
          CREATE TABLE "ProjectBudgetBaseline" (
              "id" TEXT NOT NULL,
              "projectId" TEXT NOT NULL,
              "version" INTEGER NOT NULL,
              "costingSheetId" TEXT,
              "costingNumber" TEXT NOT NULL,
              "costingRevision" INTEGER NOT NULL DEFAULT 0,
              "amount" DECIMAL(18,2) NOT NULL,
              "reason" TEXT,
              "isCurrent" BOOLEAN NOT NULL DEFAULT false,
              "lockedAt" TIMESTAMP(3),
              "lockedById" TEXT,
              "setAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "setById" TEXT NOT NULL,
              "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
              "updatedAt" TIMESTAMP(3) NOT NULL,
          
              CONSTRAINT "ProjectBudgetBaseline_pkey" PRIMARY KEY ("id")
          );
          
          -- CreateTable
          CREATE TABLE "ProjectBudgetBaselineLine" (
              "id" TEXT NOT NULL,
              "baselineId" TEXT NOT NULL,
              "costTypeId" TEXT,
              "label" TEXT NOT NULL,
              "category" "ExpenseCategory" NOT NULL,
              "amount" DECIMAL(18,2) NOT NULL,
              "sortOrder" INTEGER NOT NULL DEFAULT 0,
          
              CONSTRAINT "ProjectBudgetBaselineLine_pkey" PRIMARY KEY ("id")
          );
          
          -- CreateIndex
          CREATE INDEX "ProjectBudgetBaseline_projectId_idx" ON "ProjectBudgetBaseline"("projectId");
          
          -- CreateIndex
          CREATE INDEX "ProjectBudgetBaseline_costingSheetId_idx" ON "ProjectBudgetBaseline"("costingSheetId");
          
          -- CreateIndex
          CREATE UNIQUE INDEX "ProjectBudgetBaseline_projectId_version_key" ON "ProjectBudgetBaseline"("projectId", "version");
          
          -- CreateIndex
          CREATE INDEX "ProjectBudgetBaselineLine_baselineId_idx" ON "ProjectBudgetBaselineLine"("baselineId");
          
          -- CreateIndex
          CREATE INDEX "ProjectBudgetBaselineLine_costTypeId_idx" ON "ProjectBudgetBaselineLine"("costTypeId");
          
          -- AddForeignKey
          ALTER TABLE "ProjectBudgetBaseline" ADD CONSTRAINT "ProjectBudgetBaseline_projectId_fkey" FOREIGN KEY ("projectId") REFERENCES "Project"("id") ON DELETE CASCADE ON UPDATE CASCADE;
          
          -- AddForeignKey
          ALTER TABLE "ProjectBudgetBaseline" ADD CONSTRAINT "ProjectBudgetBaseline_costingSheetId_fkey" FOREIGN KEY ("costingSheetId") REFERENCES "CostingSheet"("id") ON DELETE SET NULL ON UPDATE CASCADE;
          
          -- AddForeignKey
          ALTER TABLE "ProjectBudgetBaseline" ADD CONSTRAINT "ProjectBudgetBaseline_lockedById_fkey" FOREIGN KEY ("lockedById") REFERENCES "User"("id") ON DELETE SET NULL ON UPDATE CASCADE;
          
          -- AddForeignKey
          ALTER TABLE "ProjectBudgetBaseline" ADD CONSTRAINT "ProjectBudgetBaseline_setById_fkey" FOREIGN KEY ("setById") REFERENCES "User"("id") ON DELETE RESTRICT ON UPDATE CASCADE;
          
          -- AddForeignKey
          ALTER TABLE "ProjectBudgetBaselineLine" ADD CONSTRAINT "ProjectBudgetBaselineLine_baselineId_fkey" FOREIGN KEY ("baselineId") REFERENCES "ProjectBudgetBaseline"("id") ON DELETE CASCADE ON UPDATE CASCADE;
          
          -- AddForeignKey
          ALTER TABLE "ProjectBudgetBaselineLine" ADD CONSTRAINT "ProjectBudgetBaselineLine_costTypeId_fkey" FOREIGN KEY ("costTypeId") REFERENCES "CostType"("id") ON DELETE SET NULL ON UPDATE CASCADE;
          

          -- Hanya satu baseline yang berlaku per proyek. Tidak bisa
          -- dinyatakan di schema.prisma karena Prisma belum mendukung indeks
          -- unik parsial; ditulis manual supaya aturannya dijaga basis data.
          CREATE UNIQUE INDEX "ProjectBudgetBaseline_one_current_per_project"
            ON "ProjectBudgetBaseline"("projectId")
            WHERE "isCurrent";
          SQL

      - name: Verify tables and constraint exist
        env:
          NEW_DATABASE_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          set -e
          echo "-- tabel baru --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT table_name FROM information_schema.tables WHERE table_name IN ('ProjectBudgetBaseline','ProjectBudgetBaselineLine') ORDER BY table_name;"
          echo "-- indeks satu-baseline-berlaku --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT indexname FROM pg_indexes WHERE indexname = 'ProjectBudgetBaseline_one_current_per_project';"
          echo "-- proyek tetap utuh --"
          psql "$NEW_DATABASE_URL" -tAc "SELECT count(*) AS proyek FROM \"Project\" WHERE \"deletedAt\" IS NULL;"
